name: gpt56-detector

# 服务器侧一键运行：从 ghcr.io 拉取 CI 打好的镜像，本机无需源码构建。
# ⚠️ 首次必须与 .env 同目录（参照 detector/.env.example 填写），并 mkdir reports
services:
  detector:
    image: ghcr.io/abigmiu/new-api/gpt56-detector:latest
    container_name: gpt56-api-detector
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./reports:/reports
    ports:
      - "${REPORT_PUBLIC_PORT:-8080}:8080"
    # 服务器若在 Cloudflare 后访问网关需要代理，可取消下面注释
    # network_mode: host